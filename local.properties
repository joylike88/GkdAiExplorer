# Local SDK/NDK paths - EDIT THESE TO MATCH YOUR F:\ DRIVE PATHS
sdk.dir=F:/AndroidSdk
# ndk.dir=F:/AndroidSdk/ndk/26.1.10909125

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Parallel & caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin daemon
kotlin.daemon.jvm.options=-Xmx2g